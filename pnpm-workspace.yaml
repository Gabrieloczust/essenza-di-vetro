# O pnpm 9 (usado pela Vercel) trata este arquivo como definicao de workspace e
# exige "packages" preenchido, senao falha com "packages field missing or empty".
packages:
  - "."

# Pacotes autorizados a rodar scripts de instalacao (vinculam binarios nativos).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
